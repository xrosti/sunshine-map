<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Саншайн — Карта зоны</title>
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">
      <h1>САНШАЙН</h1>
      <p>КАРТА ЗОНЫ</p>
    </div>

    <nav class="tabs">
      <button class="tab active" onclick="setTab('map')">КАРТА</button>
      <button class="tab" onclick="setTab('factions')">ФРАКЦИИ</button>
    </nav>
  </header>

  <main class="layout">
    <aside class="left-panel">
      <h3 id="leftTitle">УСЛОВНЫЕ ОБОЗНАЧЕНИЯ</h3>
      <div id="leftList"></div>
    </aside>

    <section class="map-zone">
      <div class="map-shell">
        <div class="map-frame" id="mapFrame">
          <img src="img/map.png" class="map-img" alt="Карта Саншайна" />
        <button class="marker monolit" data-id="limansk" style="left:21.4231%; top:17.2738%;" onclick="openLocation('limansk')"><span class="badge">М</span><b>Лиманск</b></button>
        <button class="marker greh" data-id="kpp" style="left:36.4732%; top:23.9966%;" onclick="openLocation('kpp')"><span class="badge">⚑</span><b>КПП</b></button>
        <button class="marker greh" data-id="yantar" style="left:24.8962%; top:38.0024%;" onclick="openLocation('yantar')"><span class="badge">☠</span><b>Янтарь</b></button>
        <button class="marker greh" data-id="wild" style="left:43.8459%; top:38.0024%;" onclick="openLocation('wild')"><span class="badge">☠</span><b>Дикая территория</b></button>
        <button class="marker greh" data-id="agroprom" style="left:21.7278%; top:57.2371%;" onclick="openLocation('agroprom')"><span class="badge">⚑</span><b>Агропром</b></button>
        <button class="marker greh" data-id="baraholka" style="left:40.9821%; top:53.1287%;" onclick="openLocation('baraholka')"><span class="badge">▣</span><b>Барахолка</b></button>
        <button class="marker freedom" data-id="snorks" style="left:52.9247%; top:65.0803%; " onclick="openLocation('snorks')"><span class="badge">☣</span><b>Деревня снорков</b></button>
        <button class="marker sky" data-id="water" style="left:15.0863%; top:86.3691%;" onclick="openLocation('water')"><span class="badge">◆</span><b>Водонапорная</b></button>
        <button class="marker oksop" data-id="south" style="left:41.4087%; top:84.6884%;" onclick="openLocation('south')"><span class="badge">⚑</span><b>South КПП</b></button>
 <button class="marker freedom" data-id="freedomBase" style="left:65.1719%; top:76.4717%;"onclick="openLocation('freedomBase')"><span class="badge">☣</span><b>База
Свободы</b>
</button>
        </div>
      </div>
    </section>
  </main>

  <section id="infoPanel" class="info-panel">
    <h2>Информация</h2>
    <p>Нажми на метку или фракцию.</p>
  </section>

  <footer class="bottom">
    <div class="card">
      <span>ВРЕМЯ НА СЕРВЕРЕ</span>
      <h2>00:00:00</h2>
      <p class="blue">🌙 Ночь</p>
    </div>
    <div class="card">
      <span>ОНЛАЙН НА СЕРВЕРЕ</span>
      <h2>0 / 200</h2>
      <p>Игроков</p>
    </div>
    <div class="card">
      <span>СТАТУС ЗОНЫ</span>
      <h2 class="orange">Повышенная</h2>
      <p>Активность мутантов и аномалий</p>
    </div>
    <div class="card big-timer">
      <span>ВЫБРОС ЧЕРЕЗ:</span>
      <h2>00:00:00</h2>
      <p>Ожидайте укрытие</p>
    </div>
  </footer>
</div>

<div id="editBox" class="edit-box"></div>
<script src="script.js?v=10"></script>
</body>
</html>
