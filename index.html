<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Саншайн — Карта зоны</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="logo">
      <h1>САНШАЙН</h1>
      <p>КАРТА ЗОНЫ</p>
    </div>

    <nav class="tabs">
      <button class="tab active" onclick="setTab('map')">КАРТА</button>
      <button class="tab" onclick="setTab('factions')">ФРАКЦИИ</button>
    </nav>
  </header>

  <main class="layout">
    <aside class="left-panel">
      <h3 id="leftTitle">УСЛОВНЫЕ ОБОЗНАЧЕНИЯ</h3>
      <div id="leftList"></div>
    </aside>

    <section class="map-frame">
      <img src="img/map.png" class="map-img" alt="Карта Саншайна">

      <button class="marker monolit" style="left: 430.602px; top: 65.125px;" onclick="openLocation('limansk')"><span class="badge">М</span><b>Лиманск</b></button>
      <button class="marker greh" style="left: 820.805px; top: 162.25px;" onclick="openLocation('kpp')"><span class="badge">⚑</span><b>КПП</b></button>
      <button class="marker greh" style="left: 572.984px; top: 363.422px" onclick="openLocation('yantar')"><span class="badge">☠</span><b>Янтарь</b></button>
      <button class="marker greh" style="left: 974.828px; top: 341.375px;" onclick="openLocation('wild')"><span class="badge">☠</span><b>Дикая территория</b></button>
      <button class="marker greh" style="left: 522.117px; top: 593.578px;" onclick="openLocation('agroprom')"><span class="badge">⚑</span><b>Агропром</b></button>
      <button class="marker greh" style="left: 960.141px; top: 550.578px;" onclick="openLocation('baraholka')"><span class="badge">▣</span><b>Барахолка</b></button>
      <button class="marker freedom" style="left: 1268.86px; top: 720.719px;" onclick="openLocation('snorks')"><span class="badge">☣</span><b>Деревня снорков</b></button>
      <button class="marker sky" style="left: 445.516px; top: 968.875px;" onclick="openLocation('water')"><span class="badge">◆</span><b>Водонапорная</b></button>
      <button class="marker oksop" style="left: 1002.62px; top: 995.25px;" onclick="openLocation('south')"><span class="badge">⚑</span><b>South КПП</b></button>
      <button class="marker freedom" style="left: 1487.02px; top: 885.859px;" onclick="openLocation('freedomBase')"><span class="badge">☣</span><b>База Свободы</b></button>
    </section>
  </main>

  <section id="infoPanel" class="info-panel">
    <h2>Информация</h2>
    <p>Нажми на метку или фракцию.</p>
  </section>

  <footer class="bottom">
    <div class="card">
      <span>ВРЕМЯ НА СЕРВЕРЕ</span>
      <h2>00:00:00</h2>
      <p class="blue">🌙 Ночь</p>
    </div>

    <div class="card">
      <span>ОНЛАЙН НА СЕРВЕРЕ</span>
      <h2>0 / 200</h2>
      <p>Игроков</p>
    </div>

    <div class="card">
      <span>СТАТУС ЗОНЫ</span>
      <h2 class="orange">Повышенная</h2>
      <p>Активность мутантов и аномалий</p>
    </div>

    <div class="card big-timer">
      <span>ВЫБРОС ЧЕРЕЗ:</span>
      <h2>00:00:00</h2>
      <p>Ожидайте укрытие</p>
    </div>
  </footer>

</div>
<script src="script.js"></script>
</body>
</html>

<button class="tab-btn active" id="mapBtn">КАРТА</button>
<button class="tab-btn" id="factionBtn">ФРАКЦИИ</button>
